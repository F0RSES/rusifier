name: build

# Сборка дистрибутивов TermRu.
#
# Windows .exe нельзя собрать на Linux (PyInstaller не кросс-компилирует),
# поэтому .exe делается на windows-latest, а .deb — на ubuntu-22.04
# (glibc 2.35 → пакет запускается на Ubuntu 22.04+ и Debian 12+).

on:
  push:
    branches: [ "main", "feature/gui" ]
    tags: ["v*"]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ensure smoke fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          path = Path("tests/fixtures/sample.docx")
          if path.exists():
              print(f"fixture present: {path}")
          else:
              path.parent.mkdir(parents=True, exist_ok=True)
              doc = Document()
              doc.add_paragraph("The feedback from the meeting.")
              doc.add_paragraph("Deadline and roadmap stay as they are.")
              doc.save(path)
              print(f"fixture created: {path}")
          PY
      - name: Debug unifypy
        shell: bash
        run: |
          python --version
          python -c "import sys; print('stdout encoding:', sys.stdout.encoding)"
          pip list
          python -m unifypy --help
          cat unifypy.json
      - name: Build exe
        shell: bash
        run: |
          python -m unifypy . --config unifypy.json --format exe --onefile \
            --skip-installer --clean --verbose
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::unifypy упал (exit $status), повтор с логом в файл"
            python -m unifypy . --config unifypy.json --format exe --onefile \
              --skip-installer --clean --verbose 2>&1 | tee unifypy-build.log
            status=${PIPESTATUS[0]}
          fi
          exit "$status"
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unifypy-build-logs
          path: |
            unifypy-build.log
            build/**/*.log
          if-no-files-found: ignore
      - name: Smoke test (GUI + CLI)
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $exe = "dist\TermRu.exe"
          if (-not (Test-Path $exe)) { throw "TermRu.exe не собран" }

          # Размер: GUI-сборка с Qt весит десятки мегабайт; слишком маленький
          # exe означает, что Qt не попал в бандл, слишком большой — что
          # exclude_module в unifypy.json перестал работать.
          $sizeMb = [math]::Round((Get-Item $exe).Length / 1MB)
          Write-Host "TermRu.exe: $sizeMb МБ"
          if ($sizeMb -lt 40) { throw "exe слишком мал ($sizeMb МБ): Qt/PySide6 не в бандле" }
          if ($sizeMb -gt 120) { throw "exe слишком велик ($sizeMb МБ): проверьте exclude_module" }

          if (-not (Test-Path tests\fixtures\sample.docx)) {
            throw "Фикстура tests\fixtures\sample.docx отсутствует"
          }

          # GUI-сборка остаётся консольным инструментом: аргументы включают CLI.
          $version = Start-Process -FilePath $exe -ArgumentList "--version" -Wait -PassThru -NoNewWindow
          if ($version.ExitCode -ne 0) { throw "TermRu.exe --version упал (exit $($version.ExitCode))" }

          Remove-Item -Force smoke.docx -ErrorAction SilentlyContinue
          $convert = Start-Process -FilePath $exe -Wait -PassThru -NoNewWindow -ArgumentList @(
            "--input", "${{ github.workspace }}\tests\fixtures\sample.docx",
            "--output", "smoke.docx",
            "--json"
          )
          if ($convert.ExitCode -ne 0) { throw "CLI-режим упал (exit $($convert.ExitCode))" }
          if (-not (Test-Path smoke.docx)) { throw "Output not created" }
          Write-Host "smoke ok: $((Get-Item smoke.docx).Length) bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: termru-windows-exe
          path: dist/TermRu.exe
          if-no-files-found: error

  linux-deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev fakeroot xvfb \
            libegl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxcb-cursor0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ensure smoke fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          path = Path("tests/fixtures/sample.docx")
          if path.exists():
              print(f"fixture present: {path}")
          else:
              path.parent.mkdir(parents=True, exist_ok=True)
              doc = Document()
              doc.add_paragraph("The feedback from the meeting.")
              doc.add_paragraph("Deadline and roadmap stay as they are.")
              doc.save(path)
              print(f"fixture created: {path}")
          PY
      - name: Build deb (unifypy + .desktop post-processing)
        run: packaging/build-deb.sh
      - name: Desktop post-processing test
        run: bash tests/test_deb_desktop.sh
      - name: Smoke test (install + GUI + CLI)
        run: |
          # shellcheck disable=SC2015
          sudo apt-get install -y ./dist/termru_*.deb

          # GUI: окно поднимается под виртуальным дисплеем и выходит само.
          xvfb-run -a /opt/termru/TermRu --gui-smoke

          # CLI: тот же бинарник, но с аргументами (алиас из пакета).
          termru-cli --version
          test -f tests/fixtures/sample.docx
          termru-cli --input "${{ github.workspace }}/tests/fixtures/sample.docx" --dry-run --json > "$RUNNER_TEMP/report.json"
          python -c "import json, os; \
            path = os.path.join(os.environ['RUNNER_TEMP'], 'report.json'); \
            data = json.load(open(path, encoding='utf-8')); \
            assert data['total_blocks'] > 0, data; \
            print('smoke ok:', data['total_blocks'], 'blocks')"
      - name: Check installer size
        run: |
          for deb in dist/*.deb; do
            bytes=$(stat -c%s "$deb")
            mib=$(( bytes / 1024 / 1024 ))
            echo "$deb: ${mib} МиБ"
            if (( mib > 100 )); then
              echo "::error::Пакет больше 100 МиБ ($mib) — проверьте exclude_module"
              du -sh /opt/termru/_internal/* 2>/dev/null | sort -h | tail -20
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: termru-linux-deb
          path: dist/*.deb
          if-no-files-found: error
