name: build

# Сборка дистрибутивов TermRu.
#
# Windows .exe нельзя собрать на Linux (PyInstaller не кросс-компилирует),
# поэтому .exe делается на windows-latest, а .deb — на ubuntu-22.04
# (glibc 2.35 → пакет запускается на Ubuntu 22.04+ и Debian 12+).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ensure smoke fixture
        shell: bash
        run: |
          # Фикстура есть в репозитории; шаг страхует от её отсутствия
          # (например, если файл вычистили или он не попал в архив чекаута).
          python - <<'PY'
          from pathlib import Path

          from docx import Document

          path = Path("tests/fixtures/sample.docx")
          if path.exists():
              print(f"fixture present: {path}")
          else:
              path.parent.mkdir(parents=True, exist_ok=True)
              doc = Document()
              doc.add_paragraph("The feedback from the meeting.")
              doc.add_paragraph("Deadline and roadmap stay as they are.")
              doc.save(path)
              print(f"fixture created: {path}")
          PY
      # --skip-installer: установщик Inno Setup на раннере не нужен и не соберётся.
      # strip на Windows не передаётся: unifypy не имеет CLI-флага --strip, а в
      # общем unifypy.json его нет — Linux включает его через build-deb.sh.
      # --verbose: полный лог PyInstaller сразу пишется в unifypy-build.log.
      - name: Build exe
        shell: bash
        run: |
          set -o pipefail
          python -m unifypy . --config unifypy.json --format exe --onefile \
            --skip-installer --clean --verbose 2>&1 | tee unifypy-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::unifypy упал (exit $status), повтор без кэша"
            python -m unifypy . --config unifypy.json --format exe --onefile \
              --skip-installer --clean 2>&1 | tee -a unifypy-build.log
            status=${PIPESTATUS[0]}
          fi
          exit "$status"
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unifypy-build-logs
          path: |
            unifypy-build.log
            build/**/*.log
          if-no-files-found: ignore
      - name: Smoke test
        shell: pwsh
        run: |
          # Квитанция приходит в UTF-8; без этого PowerShell декодирует её как cp1252.
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          if (-not (Test-Path tests\fixtures\sample.docx)) {
            throw "Фикстура tests/fixtures/sample.docx отсутствует"
          }
          $report = .\dist\termru.exe --input tests\fixtures\sample.docx `
                     --output smoke.docx --json | ConvertFrom-Json
          if ($report.status -ne "ok") { throw "Smoke test failed" }
          if (-not (Test-Path smoke.docx)) { throw "Output not created" }
          Write-Host "smoke ok: $($report.summary.changed_blocks) blocks changed"
      - uses: actions/upload-artifact@v4
        with:
          name: termru-windows-exe
          path: dist/termru.exe
          if-no-files-found: error

  linux-deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev fakeroot
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ensure smoke fixture
        run: |
          # Фикстура есть в репозитории; шаг страхует от её отсутствия.
          python - <<'PY'
          from pathlib import Path

          from docx import Document

          path = Path("tests/fixtures/sample.docx")
          if path.exists():
              print(f"fixture present: {path}")
          else:
              path.parent.mkdir(parents=True, exist_ok=True)
              doc = Document()
              doc.add_paragraph("The feedback from the meeting.")
              doc.add_paragraph("Deadline and roadmap stay as they are.")
              doc.save(path)
              print(f"fixture created: {path}")
          PY
      - name: Build deb (unifypy + .desktop post-processing)
        # strip=on передаётся внутри скрипта: unifypy не поддерживает CLI-флаг
        # --strip (только ключ pyinstaller.strip в конфиге). Скрипт собирает
        # временный конфиг с strip и вызывает unifypy с ним — так флаг остаётся
        # Linux-only и Windows-сборку не затрагивает.
        run: packaging/build-deb.sh
      - name: Desktop post-processing test
        run: bash tests/test_deb_desktop.sh
      - name: Smoke test (install + dry-run)
        run: |
          # shellcheck disable=SC2015
          sudo apt-get install -y ./dist/termru_*.deb
          termru --help > /dev/null
          test -f tests/fixtures/sample.docx
          termru --input tests/fixtures/sample.docx --dry-run --json > "$RUNNER_TEMP/report.json"
          python -c "import json, os; \
            path = os.path.join(os.environ['RUNNER_TEMP'], 'report.json'); \
            data = json.load(open(path, encoding='utf-8')); \
            assert data['total_blocks'] > 0, data; \
            print('smoke ok:', data['total_blocks'], 'blocks')"
      - uses: actions/upload-artifact@v4
        with:
          name: termru-linux-deb
          path: dist/*.deb
          if-no-files-found: error
